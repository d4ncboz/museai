<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>museai profiles</title>
<meta name="theme-color" content="#3b5bdb">
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #74746e; --line: #e6e6e1; --soft: #f0f0ec;
    --accent: #3b5bdb; --ok: #2b8a3e; --bad: #c92a2a; --idle: #868e96;
    --ok-bg: #ebfbee; --bad-bg: #fff0f0; --idle-bg: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1e1e1c; --text: #ececea; --muted: #9a9a94; --line: #2e2e2b; --soft: #262624;
            --accent: #8da2ff; --ok: #69db7c; --bad: #ff8787; --idle: #adb5bd;
            --ok-bg: #1d2e21; --bad-bg: #3a1f1f; --idle-bg: #2a2a28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  a { color: var(--accent); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  button, input, select { font: inherit; color: var(--text); background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button.stop { border-color: var(--bad); color: var(--bad); }
  .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  td.actions { display: flex; gap: 6px; justify-content: flex-end; }
  button.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; }
  button.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;
         stroke-linecap: round; stroke-linejoin: round; }
  button.go { color: var(--ok); }
  button.go:hover:not(:disabled) { border-color: var(--ok); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 1px 9px; }
  .p-ok { color: var(--ok); background: var(--ok-bg); }
  .p-bad { color: var(--bad); background: var(--bad-bg); }
  .p-idle { color: var(--idle); background: var(--idle-bg); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-left: 8px; }
  .empty { padding: 32px; text-align: center; }
  #error { color: var(--bad); margin: 0 0 12px; }
  #error:empty { display: none; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
           padding: 20px; width: min(380px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h2 { font-size: 16px; margin: 0 0 14px; }
  dialog label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 13px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .hint { font-size: 12px; color: var(--muted); }
  .id { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Browser profiles</h1>
    <span class="spacer"></span>
    <a href="/dashboard">Dashboard</a>
    <button class="primary" id="add">Add row</button>
  </header>
  <p id="error"></p>
  <div class="wrap">
    <table>
      <thead><tr><th>Name</th><th>Login status</th><th>Account status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="hint">Launch opens muse.ai in the profile's own browser window. Remove deletes the row only; the saved
    browser profile stays on disk (<code>bh-profile rm &lt;name&gt;</code> deletes it).</p>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle"></h2>
    <label>Name
      <input name="label" maxlength="100" autocomplete="off" placeholder="e.g. Michael Rogers">
    </label>
    <label>Profile ID
      <input name="pname" required pattern="[A-Za-z0-9_\-]{1,64}" autocomplete="off"
             title="Letters, digits, - and _ (max 64)">
    </label>
    <label>Login status
      <select name="loggedIn"><option value="no">No</option><option value="yes">Yes</option></select>
    </label>
    <label>Account status
      <select name="verified"><option value="no">Not verified</option><option value="yes">Verified</option></select>
    </label>
    <p class="hint" id="formError"></p>
    <div class="row">
      <button type="button" id="cancel">Cancel</button>
      <button class="primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
// Remote viewers pass the admin key in the fragment, as on /dashboard.
const key = new URLSearchParams(location.hash.slice(1)).get("key") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Inline icons (Lucide-style strokes), so the page needs no external assets.
const ICON = {
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  launch: '<path d="m7 4 13 8-13 8Z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  remove: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
  busy: '<path d="M21 12a9 9 0 1 1-6.2-8.6"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true" class="${name === "busy" ? "spin" : ""}">${ICON[name]}</svg>`;
const iconBtn = (act, name, label, ico, cls = "", disabled = false) =>
  `<button data-act="${act}" data-name="${name}" class="icon ${cls}" title="${label}" aria-label="${label} ${name}"${disabled ? " disabled" : ""}>${icon(ico)}</button>`;

// busy: name -> "Launching…" | "Stopping…" while a request runs.
let profiles = [], busy = new Map(), editing = null;

// Profiles live on the server as JSON files (data/profiles/<name>.json).
async function api(path, method = "GET", body) {
  const headers = key ? { Authorization: "Bearer " + key } : {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) throw new Error("not local: open /profiles#key=<admin key>");
  if (!r.ok) {
    const e = await r.json().catch(() => null);
    throw new Error(e?.error?.message || r.status + " " + r.statusText);
  }
  return r.json();
}
const url = (name, tail = "") => `/profiles/${encodeURIComponent(name)}${tail}`;
const dataUrl = (name) => `/profiles/data/${encodeURIComponent(name)}`;

const showError = (e) => { $("error").textContent = e ? String(e.message || e) : ""; };
const pill = (yes, on, off) => `<span class="pill ${yes ? "p-ok" : "p-idle"}">${yes ? on : off}</span>`;

function render() {
  if (!profiles.length) {
    $("rows").innerHTML = `<tr><td colspan="4" class="empty muted">No profiles yet. Click Add row.</td></tr>`;
    return;
  }
  $("rows").innerHTML = profiles.map((p) => {
    const on = p.running, wait = busy.get(p.name), n = esc(p.name);
    return `<tr>
      <td>${esc(p.label || p.name)}${on ? `<span class="dot" title="Running"></span>` : ""}
        ${p.label ? `<div class="id">${n}</div>` : ""}</td>
      <td>${pill(p.logged_in, "Yes", "No")}</td>
      <td>${pill(p.verified, "Verified", "Not verified")}</td>
      <td class="actions">
        ${iconBtn("edit", n, "Edit", "edit")}
        ${wait ? iconBtn("toggle", n, wait, "busy", "", true)
               : on ? iconBtn("toggle", n, "Stop", "stop", "stop") : iconBtn("toggle", n, "Launch", "launch", "go")}
        ${iconBtn("remove", n, "Remove", "remove", "danger", !!wait)}
      </td></tr>`;
  }).join("");
}

async function refresh() {
  try {
    profiles = (await api("/profiles/data")).profiles;
    showError(null);
  } catch (e) { showError(e); }
  render();
}

async function toggle(name) {
  const on = profiles.find((p) => p.name === name)?.running;
  busy.set(name, on ? "Stopping…" : "Launching…"); render();
  try {
    await api(url(name, on ? "/stop" : "/launch"), "POST");
    showError(null);
  } catch (e) { showError(e); }
  busy.delete(name);
  await refresh();
}

async function remove(name) {
  if (!confirm(`Remove "${name}" from the list? The saved browser profile stays on disk.`)) return;
  busy.set(name, "Stopping…"); render();
  try { await api(dataUrl(name), "DELETE"); } catch (e) { showError(e); }
  busy.delete(name);
  await refresh();
}

function openDialog(p) {
  editing = p;
  const f = $("form");
  $("dlgTitle").textContent = p ? `Edit ${p.label || p.name}` : "Add profile";
  f.label.value = p ? p.label || "" : "";
  f.pname.value = p ? p.name : "";
  // The name is the bh-profile folder name, so it is fixed once the row exists.
  f.pname.readOnly = !!p;
  f.loggedIn.value = p?.logged_in ? "yes" : "no";
  f.verified.value = p?.verified ? "yes" : "no";
  $("formError").textContent = "";
  $("dlg").showModal();
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = $("form"), name = f.pname.value.trim();
  if (name === "default") { $("formError").textContent = '"default" is reserved.'; return; }
  if (!editing && profiles.some((p) => p.name === name)) {
    $("formError").textContent = `"${name}" already exists.`;
    return;
  }
  const body = { label: f.label.value.trim(), logged_in: f.loggedIn.value === "yes", verified: f.verified.value === "yes" };
  try {
    if (editing) await api(dataUrl(name), "PUT", body);
    else await api("/profiles/data", "POST", { name, ...body });
  } catch (e) { $("formError").textContent = e.message; return; }
  $("dlg").close();
  await refresh();
});
$("cancel").addEventListener("click", () => $("dlg").close());
$("add").addEventListener("click", () => openDialog(null));
$("rows").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-act]");
  if (!b) return;
  const p = profiles.find((x) => x.name === b.dataset.name);
  if (!p) return;
  if (b.dataset.act === "edit") openDialog(p);
  else if (b.dataset.act === "toggle") toggle(p.name);
  else if (b.dataset.act === "remove") remove(p.name);
});

refresh();
// Keep Launch/Stop in sync when a window is closed by hand or an agent launches a profile.
setInterval(() => { if (!document.hidden && !busy.size) refresh(); }, 3000);
</script>
</body>
</html>
